# Render Blueprint — deploys Life Tracker as a static site.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: life-tracker
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Vite inlines env vars at BUILD time, so these must be set in Render
    # (Dashboard → Environment) before the build. sync:false = not stored here.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA fallback: every unknown path serves index.html so client-side
    # routes (e.g. /today, /board) work on refresh and deep links.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Keep the service worker fresh so PWA updates roll out promptly.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
